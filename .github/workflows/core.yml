name: Core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report toolchain
        run: swift --version

      - name: Run Core tests
        run: swift test --package-path Core

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.3-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system SQLite
        run: apt-get update && apt-get install --yes libsqlite3-dev

      - name: Report toolchain
        run: swift --version

      - name: Run Core tests
        run: swift test --package-path Core

  windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Swift 6.3.3
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --exact --version 6.3.3 --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machinePath;$userPath"
          $env:Path -split ";" | Where-Object { $_ } | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          swift --version

      - name: Report toolchain
        run: swift --version

      - name: Run Core tests
        run: swift test --package-path Core
