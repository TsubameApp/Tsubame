name: Core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report toolchain
        run: swift --version

      - name: Run Core tests
        run: swift test --package-path Core

      - name: Smoke-test dictionary CLI
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/tsubame-cli-smoke"
          cli_temp="$RUNNER_TEMP/tsubame-cli-temporary"
          mkdir -p "$cli_temp"
          export TMPDIR="$cli_temp/"

          dry_output="$(swift run --package-path Core TsubameCLI import Core/Tests/TsubameCLIPlatformTests/Resources/CLIYomitanDictionary --dry-run --debug)"
          echo "$dry_output"
          grep -Fq "[debug] bank 1/5" <<< "$dry_output"
          grep -Fq "[debug] total import:" <<< "$dry_output"
          test -z "$(find "$cli_temp" -maxdepth 1 -type d -name 'TsubameCLI-DryRun-*' -print -quit)"

          swift run --package-path Core TsubameCLI import Core/Tests/TsubameCLIPlatformTests/Resources/CLIYomitanDictionary --data-root "$smoke_root" --debug
          test "$(find "$smoke_root/Dictionaries" -type f -name dictionary.sqlite | wc -l | tr -d ' ')" = "1"
          test "$(find "$smoke_root/Dictionaries" -type f -name manifest.json | wc -l | tr -d ' ')" = "1"
          test "$(find "$smoke_root/Dictionaries" -type f -path '*/resources/images/bird.svg' | wc -l | tr -d ' ')" = "1"

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.3-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system SQLite
        run: apt-get update && apt-get install --yes libsqlite3-dev

      - name: Report toolchain
        run: swift --version

      - name: Run Core tests
        run: swift test --package-path Core

      - name: Smoke-test dictionary CLI
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/tsubame-cli-smoke"
          cli_temp="$RUNNER_TEMP/tsubame-cli-temporary"
          mkdir -p "$cli_temp"
          export TMPDIR="$cli_temp/"

          dry_output="$(swift run --package-path Core TsubameCLI import Core/Tests/TsubameCLIPlatformTests/Resources/CLIYomitanDictionary --dry-run --debug)"
          echo "$dry_output"
          grep -Fq "[debug] bank 1/5" <<< "$dry_output"
          grep -Fq "[debug] total import:" <<< "$dry_output"
          test -z "$(find "$cli_temp" -maxdepth 1 -type d -name 'TsubameCLI-DryRun-*' -print -quit)"

          swift run --package-path Core TsubameCLI import Core/Tests/TsubameCLIPlatformTests/Resources/CLIYomitanDictionary --data-root "$smoke_root" --debug
          test "$(find "$smoke_root/Dictionaries" -type f -name dictionary.sqlite | wc -l | tr -d ' ')" = "1"
          test "$(find "$smoke_root/Dictionaries" -type f -name manifest.json | wc -l | tr -d ' ')" = "1"
          test "$(find "$smoke_root/Dictionaries" -type f -path '*/resources/images/bird.svg' | wc -l | tr -d ' ')" = "1"

  windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Swift 6.3.3
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --exact --version 6.3.3 --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $refreshedEnvironment = @{}
          foreach ($level in "Machine", "User") {
            [Environment]::GetEnvironmentVariables($level).GetEnumerator() | ForEach-Object {
              if ($_.Name -eq "Path") {
                $_.Value = ("$env:Path;$($_.Value)" -split ";" | Select-Object -Unique) -join ";"
              }
              Set-Item -Path "Env:$($_.Name)" -Value $_.Value
              $refreshedEnvironment[$_.Name] = $_.Value
            }
          }

          $env:Path -split ";" | Where-Object { $_ } | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $refreshedEnvironment.GetEnumerator() | Where-Object { $_.Name -ne "Path" } | ForEach-Object {
            "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          if (-not $env:SDKROOT -or -not (Test-Path $env:SDKROOT)) {
            throw "Swift installer did not configure a valid SDKROOT."
          }

          swift --version
          swiftc -print-target-info

      - name: Report toolchain
        run: swift --version

      - name: Run Core tests
        run: swift test --package-path Core

      - name: Smoke-test dictionary CLI
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "tsubame-cli-smoke"
          $cliTemp = Join-Path $env:RUNNER_TEMP "tsubame-cli-temporary"
          New-Item -ItemType Directory -Path $cliTemp -Force | Out-Null
          $env:TEMP = $cliTemp
          $env:TMP = $cliTemp

          $dryOutput = & swift run --package-path Core TsubameCLI import Core/Tests/TsubameCLIPlatformTests/Resources/CLIYomitanDictionary --dry-run --debug 2>&1
          $dryExitCode = $LASTEXITCODE
          $dryOutput | ForEach-Object { Write-Host $_ }
          if ($dryExitCode -ne 0) { exit $dryExitCode }
          if (-not ($dryOutput -match "\[debug\] bank 1/5")) { throw "Missing bank progress output." }
          if (-not ($dryOutput -match "\[debug\] total import:")) { throw "Missing total timing output." }
          if (Get-ChildItem -Path $cliTemp -Directory -Filter "TsubameCLI-DryRun-*" -ErrorAction SilentlyContinue) {
            throw "Dry run left a temporary bundle behind."
          }

          & swift run --package-path Core TsubameCLI import Core/Tests/TsubameCLIPlatformTests/Resources/CLIYomitanDictionary --data-root $smokeRoot --debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@(Get-ChildItem -Path "$smokeRoot/Dictionaries" -Recurse -File -Filter "dictionary.sqlite").Count -ne 1) {
            throw "Expected exactly one dictionary database."
          }
          if (@(Get-ChildItem -Path "$smokeRoot/Dictionaries" -Recurse -File -Filter "manifest.json").Count -ne 1) {
            throw "Expected exactly one dictionary manifest."
          }
          if (@(Get-ChildItem -Path "$smokeRoot/Dictionaries" -Recurse -File -Filter "bird.svg").Count -ne 1) {
            throw "Expected copied SVG resource."
          }
