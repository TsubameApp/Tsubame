name: Core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report toolchain
        run: swift --version

      - name: Run Core tests
        run: swift test --package-path Core

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.3-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system SQLite
        run: apt-get update && apt-get install --yes libsqlite3-dev

      - name: Report toolchain
        run: swift --version

      - name: Run Core tests
        run: swift test --package-path Core

  windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Swift 6.3.3
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain --exact --version 6.3.3 --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $refreshedEnvironment = @{}
          foreach ($level in "Machine", "User") {
            [Environment]::GetEnvironmentVariables($level).GetEnumerator() | ForEach-Object {
              if ($_.Name -eq "Path") {
                $_.Value = ("$env:Path;$($_.Value)" -split ";" | Select-Object -Unique) -join ";"
              }
              Set-Item -Path "Env:$($_.Name)" -Value $_.Value
              $refreshedEnvironment[$_.Name] = $_.Value
            }
          }

          $env:Path -split ";" | Where-Object { $_ } | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $refreshedEnvironment.GetEnumerator() | Where-Object { $_.Name -ne "Path" } | ForEach-Object {
            "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          if (-not $env:SDKROOT -or -not (Test-Path $env:SDKROOT)) {
            throw "Swift installer did not configure a valid SDKROOT."
          }

          swift --version
          swiftc -print-target-info

      - name: Report toolchain
        run: swift --version

      - name: Run Core tests
        run: swift test --package-path Core
