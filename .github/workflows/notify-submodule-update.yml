name: Notify umbrella about a component update

on:
  workflow_call:
    inputs:
      component:
        description: Submodule path in the umbrella repository
        required: true
        type: string
    secrets:
      automation_token:
        description: Fine-grained token allowed to dispatch events to TsubameApp/Tsubame
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch submodule update
        env:
          COMPONENT: ${{ inputs.component }}
          GH_TOKEN: ${{ secrets.automation_token }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::notice::TSUBAME_AUTOMATION_TOKEN is not configured; skipping umbrella notification."
            exit 0
          fi

          gh api \
            --method POST \
            repos/TsubameApp/Tsubame/dispatches \
            -f event_type=submodule-updated \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[component]=${COMPONENT}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
